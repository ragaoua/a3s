[project]
name = "a3s-agent"
version = "0.1.0"
description = "a2s configurable agent server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0", # Postgres driver, loaded by sqlalchemy through the persistence connect string
    "aiosqlite>=0.21.0", # SQLite driver, loaded by sqlalchemy through the persistence connect string
    "sqlalchemy[asyncio]>=2.0.0", # builds the AsyncEngine backing the A2A DatabaseTaskStore
    "authlib>=1.3.0",
    "google-adk[a2a,extensions]>=2.5.0", # extensions provides litellm
    "a2a-sdk[http-server]>=1.1.2,<2", # http-server (starlette + sse-starlette) backs a2a.server.routes
    "starlette>=1.3.1",
    "uvicorn>=0.49.0",
    "httpx>=0.28.1",
    "typing-extensions>=4.15.0",
    "pydantic>=2.12.5", # Forced by google-adk[extensions]
    "pyjwt>=2.13.0",
    "mcp>=1.28.0",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-exporter-otlp-proto-http>=1.38.0",
    "opentelemetry-instrumentation-httpx>=0.59b0",
    "opentelemetry-sdk>=1.38.0",
    "pyyaml>=6.0",
    "returns>=0.27.0",
    "opentelemetry-instrumentation-starlette>=0.59b0",
    "openinference-instrumentation-google-adk>=0.1.16",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project.scripts]
a3s-agent = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-httpserver>=1.1.5",
    "pytest-iam>=0.2.5",
    "testcontainers[keycloak,postgres]>=4.9.0",
    "deptry>=0.25.1"
]

[tool.pytest.ini_options]
addopts = "--disable-warnings -m 'not e2e'"
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests against a real LLM (manual only; opt in with `-m e2e`)",
]

[tool.deptry]
known_first_party = ["src"]

[tool.deptry.per_rule_ignores]
DEP002 = ["asyncpg", "aiosqlite", "sqlalchemy"] # persistence dependencies are loaded through the ADK/A2A database services

[tool.deptry.package_module_name_map]
pydantic = ["pydantic", "pydantic_core"] # pydantic_core ships separately but is guaranteed by pydantic;
